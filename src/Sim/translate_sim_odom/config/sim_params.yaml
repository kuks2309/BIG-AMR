/translate_sim_odom_node:
  ros__parameters:
    # ── Wheel positions (base_link, m) ──
    # ⚠ 이 값은 컨트롤러가 쓰는 기하와 **같아야 한다** — 플랜트가 다른 기하를 쓰면 SIL 이
    #   검증하는 대상이 사라진다. 정본은 trnav_2ws_core/config/robot_geometry_2ws.yaml 이고
    #   검사기 C6 이 상시 대조한다. 여기 값을 단독으로 고치지 말 것.
    w1_x:  0.6039
    # ⚠ y 는 **0 이어야 한다.** 2WS 는 구조상 제자리 스핀이 ±90° 이기 때문이다.
    #   Seer live_models 에서 뽑으면 −0.0014 m 같은 잔차가 딸려 오는데 그것은 실측 잔차이지 설계값이 아니다.
    #   두 바퀴가 같은 y 를 가지면 그 값은 기구학에서 **가정하는 회전중심을 횡으로 y 만큼
    #   옮기는** 역할만 한다 — 바퀴가 센터라인에 있으므로 자연스러운 회전중심도 그 선 위(y=0)다.
    #   잔차를 남기면 제자리 스핀이 ±89.867° 로 나와 구조값 ±90° 와 어긋난다.
    #   다른 기동 영향은 미미하다(turn R=1.0 m 에서 0.036°, R=0.2 m 에서 0.12°).
    w1_y: 0.0
    w2_x: -0.5961
    w2_y: 0.0

    # ── Initial pose (map frame) ──
    # SIL 검증 시나리오 기준점 — kkw1.json 의 N17 위치, yaw=0(+X east).
    # 이 자세에서 L3 역주행(N17→N2)은 edge 방향이 약 180°(west)라 정합각 180° 로 reverse 가 성립한다.
    initial_x:   4.952
    initial_y:   -2.327
    initial_yaw: 0.0   # rad

    # ── Integration ──
    integrate_rate_hz: 50.0

    # ── IMU yaw offset (S7 calibration test scenario) ──
    # imu_published_yaw = ground_truth_yaw + imu_yaw_offset_deg.
    # Default 0 = legacy behavior (IMU == map yaw).
    # Used only by yaw_control SIL S7 to verify yaw_offset = wrap(start_yaw_map - start_yaw_imu).
    imu_yaw_offset_deg: 0.0
