/translate_sim_odom_node:
  ros__parameters:
    # ── Wheel geometry ──
    # **여기 두지 않는다.** 이 파일은 2WS·QD SIL 런치가 **함께** 받으므로 기하를 담으면
    #   두 플랫폼이 같은 기하로 돌고, 플랜트가 컨트롤러와 어긋나는 쪽이 생긴다.
    #   정본은 플랫폼별로 갈린다:
    #     2WS → trnav_2ws_core/config/robot_geometry_2ws.yaml
    #     QD  → trnav_motion_core/config/robot_geometry_qd.yaml
    #   런치가 그중 하나를 이 파일 뒤에 얹는다.

    # ── Initial pose (map frame) ──
    # SIL 검증 시나리오 기준점 — kkw1.json 의 N17 위치, yaw=0(+X east).
    # 이 자세에서 L3 역주행(N17→N2)은 edge 방향이 약 180°(west)라 정합각 180° 로 reverse 가 성립한다.
    initial_x:   4.952
    initial_y:   -2.327
    initial_yaw: 0.0   # rad

    # ── Integration ──
    integrate_rate_hz: 50.0

    # ── IMU yaw offset (S7 calibration test scenario) ──
    # imu_published_yaw = ground_truth_yaw + imu_yaw_offset_deg.
    # Default 0 = legacy behavior (IMU == map yaw).
    # Used only by yaw_control SIL S7 to verify yaw_offset = wrap(start_yaw_map - start_yaw_imu).
    imu_yaw_offset_deg: 0.0
