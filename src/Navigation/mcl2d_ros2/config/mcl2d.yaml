# mcl2d_localization 파라미터.
#
# ⚠ 여기 값은 **전부 노드 기본값과 동일**하다. 즉 이 파일을 그대로 쓰면 거동이 바뀌지 않는다.
#    코어 값들은 원본 Seer libMCLoc 대조로 고정된 충실도 기준선이므로, 바꾸면 노드가 기동 시
#    WARN 으로 "충실도 기준선 이탈" 을 남긴다. 바꿀 때는 그 로그와 함께 근거를 남길 것.
# 노출하지 않은 코어 파라미터(산포 모드 임계·재측위·슬립 등 20여 개)는 의도적으로 고정이다 —
#    필요해지면 그때 근거와 함께 연다.

/mcl2d_localization:
  ros__parameters:
    # 프레임 (frame) — 측위는 map→odom 보정항만 발행한다. odom→base_link 는 오도메트리 소유.
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    publish_tf: true

    # 초기 자세 (initial pose)
    init_x: 0.0                      # m
    init_y: 0.0                      # m
    init_theta: 0.0                  # rad
    # ⚠ 산포는 **초기 자세를 아는가**에 따라 갈린다. 이식 기준값은 π(전방향 미지)인데, 초기 자세를
    #   /initialpose 로 정확히 주는 우리 운용에서는 그 값이 해롭다 — 필터가 360° 중 엉뚱한 각도에서
    #   더 높은 우도를 찾아 이탈한다(2026-08-07 실측: 초기 179.60° → 수렴 -84.86°, 맵까지 중앙값 1.11 m).
    #   좁히면 초기값 근처를 지킨다(같은 조건 0.10 rad: 수렴 175.12°, 중앙값 0.143 m).
    #   전역 재측위(초기 자세를 모르는 상태)를 할 때만 π 로 되돌릴 것.
    init_dist_scatter: 0.30          # m,   초기 파티클 위치 산포 반경 (이식 기준값 0.7)
    init_angle_scatter: 0.10         # rad, 초기 파티클 각도 산포 (이식 기준값 3.1416=π)

    # 라이다 장착 [x,y,yaw] 반복 (m, m, rad).
    # ⚠ 이 노드는 **병합 스캔(/scan_merged) 하나**를 구독한다. merger 가 이미 base_link 기준으로
    #   변환해 놓았으므로 여기서 또 변환하면 이중 적용이 된다 → 무변환 [0,0,0] 이 정답이다.
    #   개별 스캔을 직접 먹이는 구성으로 바꿀 때만 실제 장착값을 넣는다. 그때 값의 정본은
    #   **merger 캘리브레이션**(TF base_link→scan_*)이지 Seer 설정이 아니다 — 2026-08-07 실측으로
    #   둘이 갈렸다(front yaw 0.573°, rear yaw 0.197°·y 9.6 mm). 정합은 merger 쪽이 맞았다.
    laser_mounts: [0.0, 0.0, 0.0]

    # 처리율 손잡이 (throughput) — 노드는 단일 스레드로 1코어를 포화시킨다. 이 값이 곧 처리율이다.
    init_particle_number: 10000      # 개, 초기 표본 수
    min_particle_number: 500         # 개, 적응 표본 하한
    max_particle_number: 3000        # 개, 적응 표본 상한
    beams_used: 541                  # 개, 우도 계산에 쓰는 최대 빔 수

    # 판정 게이트 (gate)
    motor_stop_threshold: 0.02       # m/s·rad/s, 이하이면 정지로 보고 예측(kMove)을 생략한다
    stop_confidence: 0.02            # 파티클 평균 가중치가 이 아래면 LowConfidence 로 보고
