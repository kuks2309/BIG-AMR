# 벽 3면 라이다 정밀 측위 파라미터.
# 기준 특징면은 스테이션 프레임 끝점 2개 [x1, y1, x2, y2] (m).
# ⚠ 아래 벽 좌표는 예시 U자 스테이션이다 — 실 스테이션 실측값으로 교체해야 한다.
#   벤더(ANT) 는 도면 이론값 사용을 나쁜 방법으로 경고한다("Small differences are always
#   present in a layout") — 가능하면 현장 실측으로 채우고, 잔차 진단으로 검증할 것.
feature_localizer:
  ros__parameters:
    station_frame: "station"
    base_frame: "base_link"

    # 기준 특징면 — 서로 다른 방위 2면 이상 필수 (평행 벽만으로는 해를 내지 않는다).
    # 항상 같이 보이는 평행 벽 쌍은 오인 위험이 있으니 게이트(gate_dist_m)보다
    # 서로 충분히 떨어져 있어야 한다.
    feature_names: ["front", "left", "right"]
    features.front: [2.0, -1.5, 2.0, 1.5]
    features.left: [0.0, 1.5, 2.0, 1.5]
    features.right: [0.0, -1.5, 2.0, -1.5]

    # 스테이션 진입 시 로봇 초기 추정 (스테이션 프레임, m·deg)
    initial_x_m: 0.4
    initial_y_m: 0.0
    initial_yaw_deg: 0.0

    # 라이다 외부 파라미터 — 기본은 첫 스캔 frame_id 의 정적 TF (seer_lidar_tf 발행).
    # TF 를 못 쓰는 구성에서만 false 로 내리고 laser_* 를 실측으로 채운다.
    use_tf_extrinsic: true
    laser_x_m: 0.0
    laser_y_m: 0.0
    laser_yaw_deg: 0.0

    # 직선 추출
    range_min_m: 0.05
    range_max_m: 30.0
    scan_angle_min_deg: -180.0
    scan_angle_max_deg: 180.0
    max_point_gap_m: 0.2
    split_dist_m: 0.03          # 거리 잡음 3σ 수준 — 더 좁히면 잡음이 벽을 토막 낸다
    merge_angle_deg: 5.0
    merge_dist_m: 0.03
    min_points: 8
    min_length_m: 0.4           # ANT 최소 추출 세그먼트 40 cm 준용

    # 벽 대응 (선분은 1:N 귀속 — 대응 근거, 측정은 회랑 재적합)
    gate_angle_deg: 10.0
    gate_dist_m: 0.3
    min_overlap_ratio: 0.25     # (귀속 선분 구간 합집합)/예측 벽 구간 길이
    refit_corridor_m: 0.06      # 재적합 회랑 반폭 — 잡음 3σ 이상, 벽 근처 클러터보다 작게
    refit_margin_m: 0.1         # 예측 벽 구간 양끝 여유

    # 자세 해석
    min_normal_spread: 0.05     # 벽 2면 등가중 기준 법선 사이각 ≳26° 요구
    max_iterations: 3

    # 품질 판정
    min_walls: 2
    max_dist_residual_m: 0.03
    max_angle_residual_deg: 3.0
    max_jump_m: 0.1
    max_jump_deg: 5.0
    max_consecutive_rejects: 5
