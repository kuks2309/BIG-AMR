# slam_mapping (slam_karto_ros2) 파라미터.
#
# ⚠ 여기 값은 **전부 노드 기본값과 동일**하다 — 그대로 쓰면 거동이 바뀌지 않는다.
# ⚠ 이 노드는 TF 를 발행하지 않는다. map→odom 은 mcl2d 소유이므로
#    (docs/code_review/mcl2d-localization-chain/2026-08-07.md H1) 매핑 중에는 mcl2d 를 띄우지 말 것.

/slam_mapping:
  ros__parameters:
    # 토픽 (topic)
    scan_topic: "/scan_merged"   # sensor_msgs/LaserScan, SensorDataQoS(BEST_EFFORT)로 구독
    odom_topic: "/odom"          # nav_msgs/Odometry,     BEST_EFFORT 로 구독
    map_topic: "/map"            # nav_msgs/OccupancyGrid, transient_local 로 발행
    map_frame: "map"             # OccupancyGrid header.frame_id

    # 라이다 장착 [x, y, yaw] — **스캔 토픽 프레임 기준** 로봇좌표 오프셋 (m, m, rad)
    #   /scan_merged 는 frame_id `scan_merged` 이고 base_link 와 동일 위치다
    #   (dual_laser_merger/launch/dual_sick_merger.launch.py:41-43 static TF 전 성분 0)
    #   → 병합기가 이미 이 프레임으로 빔을 옮겨 놓았으므로 여기서는 0 이다(이중 적용 금지).
    #   원시 단일 라이다를 직접 물릴 때만 그 센서 실측 장착값을 넣는다. Foil_A082 정값
    #   (mcl2d_ros2/config/mcl2d.yaml:26-27, Seer 컨트롤러 1500 조회 2026-08-07):
    #     FrontLiDAR  x 0.881676  y -0.578664  yaw -0.785398 rad (-45.000°)
    #     RearLiDAR   x -0.857000 y  0.597100  yaw  2.361256 rad (135.290°)
    laser_offset_x: 0.0
    laser_offset_y: 0.0
    laser_offset_yaw: 0.0

    # 거리 유효구간 (m). 범위 밖 빔은 **정규화하지 않고** 원시값 그대로 Karto 에 넘겨 필터가 거른다
    # (정규화하면 max_range 값이 Karto 의 InRange 상한을 통과해 무반사가 유효 히트로 둔갑한다 — 실측 확인).
    # 0.001 은 원본 실측값(KartoSLAM.cpp:32 `SetMinimumRange(0.001)`).
    min_range: 0.001
    max_range: 30.0

    # 격자 (grid)
    map_resolution: 0.02         # m/cell — 원본 해상도. 근거: 실맵 헤더 "resolution":0.02
    max_map_cells: 25000000      # cell — OccupancyGrid.data 는 셀당 1 byte 다(= 메시지 크기 상한)
    map_publish_period: 2.0      # s — buildMap 은 전 스캔을 훑는다. 스캔 주기로 돌리지 말 것

    # 반사판 (rssi)
    rssi_threshold: 150.0        # 이 값을 **초과**하는 intensity 빔만 rssiPosList 로. 원본 실측값(SlaMapping.cpp:91)
                                 # ⚠ 원본 RssiThres 런타임값은 미확정(seer_slam_mapper.hpp:72-73)

    # 백엔드 (g2o)
    g2o_max_iterations: 50       # LM 반복 상한 — 원본 실측값(`0xebb20 mov $0x32,%esi`)

    # 처리 큐 — 매핑이 입력보다 느릴 때의 동작
    queue_size: 50               # 개
    queue_full_policy: "keep_latest"  # "keep_latest"(오래된 것 폐기) | "drop_newest"(새 것 폐기)
    odom_match_max_dt: 0.035     # s — 스캔↔오도 시각차 게이트. 병합 스캔 주기 0.067s 의 절반 수준

    # 동작
    auto_start: true             # false 면 ~/start_mapping 호출 전까지 스캔을 받지 않는다
    save_path: ""                # ~/save_map 저장 경로(.smap). 비어 있으면 save_map 이 실패한다
    map_name: "slam_map"         # .smap header.mapName
    smap_version: "1.0.6"        # .smap header.version — 회수 실맵과 동일값
