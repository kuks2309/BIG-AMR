# Bad: V-04 — source_ids 에 동일 id 중복 등록
#
# 특수 케이스 설명:
#   YAML map(사전) 에서 source_3 블록을 두 번 정의하면 파서가 마지막 값으로 덮어쓰므로,
#   실제 파싱 결과에는 중복이 남지 않을 수 있다 (YAML map 자동 unique 특성).
#   그러나 source_ids 리스트 [0, 1, 3, 3] 은 리스트이므로 중복 값이 그대로 유지된다.
#   V-04 검증은 source_ids 리스트를 순회하며 id 집합에 삽입 실패 시 FATAL 을 발생시켜야 한다.
trnav_motion_mux:
  ros__parameters:
    output_topic: "/motion/wheel_out"
    default_source_id: 0
    source_ids: [0, 1, 3, 3]   # ← V-04 위반: id=3 이 두 번 등록됨

    source_0:
      name: "joystick"
      topic: "/motion/wheel_cmd/joystick"
      timeout_ms: 200

    source_1:
      name: "translate_forward"
      topic: "/motion/wheel_cmd/action"
      timeout_ms: 200

    source_3:
      name: "spin"
      topic: "/motion/wheel_cmd/spin"
      timeout_ms: 200
