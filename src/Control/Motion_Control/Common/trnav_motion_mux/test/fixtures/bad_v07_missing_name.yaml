# Bad: V-07 — source_3 의 name 필드가 빈 문자열 (필수 필드 누락)
trnav_motion_mux:
  ros__parameters:
    output_topic: "/motion/wheel_out"
    default_source_id: 0
    source_ids: [0, 1, 3]

    source_0:
      name: "joystick"
      topic: "/motion/wheel_cmd/joystick"
      timeout_ms: 200

    source_1:
      name: "translate_forward"
      topic: "/motion/wheel_cmd/action"
      timeout_ms: 200

    source_3:
      name: ""                          # ← V-07 위반: name 이 빈 문자열 (필수 필드 누락으로 처리)
      topic: "/motion/wheel_cmd/spin"
      timeout_ms: 200
