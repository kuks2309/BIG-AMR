# Bad: V-05 — source_3 과 source_5 가 동일 name="spin" (중복 name)
trnav_motion_mux:
  ros__parameters:
    output_topic: "/motion/wheel_out"
    default_source_id: 0
    source_ids: [0, 1, 3, 5]

    source_0:
      name: "joystick"
      topic: "/motion/wheel_cmd/joystick"
      timeout_ms: 200

    source_1:
      name: "translate_forward"
      topic: "/motion/wheel_cmd/action"
      timeout_ms: 200

    source_3:
      name: "spin"                      # ← V-05 위반 기준점: "spin" 첫 등록
      topic: "/motion/wheel_cmd/spin"
      timeout_ms: 200

    source_5:
      name: "spin"                      # ← V-05 위반: name "spin" 중복
      topic: "/motion/wheel_cmd/spin2"
      timeout_ms: 200
