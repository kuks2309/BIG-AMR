# Bad: V-02 — id=1 의 name 이 "translate_forward" 가 아님 (2026-05-16 SSOT)
trnav_motion_mux:
  ros__parameters:
    output_topic: "/motion/wheel_out"
    default_source_id: 0
    source_ids: [0, 1, 3]

    source_0:
      name: "joystick"
      topic: "/motion/wheel_cmd/joystick"
      timeout_ms: 200

    source_1:
      name: "wrong_name"      # ← V-02 위반: id=1 은 반드시 name="translate_forward" 이어야 함
      topic: "/motion/wheel_cmd/action"
      timeout_ms: 200

    source_3:
      name: "spin"
      topic: "/motion/wheel_cmd/spin"
      timeout_ms: 200
