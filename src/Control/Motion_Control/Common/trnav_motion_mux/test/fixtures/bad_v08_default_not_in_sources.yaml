# Bad: V-08 — default_source_id=99 이 source_ids 집합에 없음
trnav_motion_mux:
  ros__parameters:
    output_topic: "/motion/wheel_out"
    default_source_id: 99              # ← V-08 위반: id=99 는 source_ids [0, 1, 3] 에 없음
    source_ids: [0, 1, 3]

    source_0:
      name: "joystick"
      topic: "/motion/wheel_cmd/joystick"
      timeout_ms: 200

    source_1:
      name: "translate_forward"
      topic: "/motion/wheel_cmd/action"
      timeout_ms: 200

    source_3:
      name: "spin"
      topic: "/motion/wheel_cmd/spin"
      timeout_ms: 200
