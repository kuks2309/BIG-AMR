# Bad: V-09 — id < 0 (정수성 위반) — PLACEHOLDER ONLY
#
# V-09 skipped (uint8 type guarantees):
#   trnav_motion_mux_io_contract.md §11 의 서비스 정의에서 source_id 는 uint8_t 타입이다.
#   uint8_t 은 0~255 범위만 허용하므로 YAML 에서 음수를 지정해도 ROS2 파라미터 로드 시
#   타입 에러(정수 범위 초과)가 먼저 발생한다.
#   따라서 V-09 (id < 0) 는 yaml 레벨에서 직접 유도할 수 없으며,
#   C++ 코드에서 int 로 파싱 후 검증하는 경우에만 테스트 가능하다.
#   이 파일은 V-09 검증 구현 시 참고용 placeholder 로만 사용한다.
#
# 아래는 이론적으로 V-09 를 유도하려는 시도 (실제로는 파서 에러 또는 타입 에러 발생):
trnav_motion_mux:
  ros__parameters:
    output_topic: "/motion/wheel_out"
    default_source_id: 0
    source_ids: [0, 1, 3]

    source_0:
      name: "joystick"
      topic: "/motion/wheel_cmd/joystick"
      timeout_ms: 200

    source_1:
      name: "translate_forward"
      topic: "/motion/wheel_cmd/action"
      timeout_ms: 200

    source_3:
      name: "spin"
      topic: "/motion/wheel_cmd/spin"
      timeout_ms: 200

# NOTE: source_ids 에 -1 같은 음수를 넣으면 uint8 타입으로 파싱 불가 → ROS2 파라미터 로드 실패.
#       V-09 는 int 파싱 후 `if (id < 0)` 검사이므로, 실제 테스트는 C++ 단위 테스트에서 수행해야 함.
