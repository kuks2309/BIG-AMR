/trnav_yaw_control_node:
  # ⚠ **본 파일의 파라미터는 전부 생성자에서 1회만 읽힌다.** `yaw_control` 에는
  #   `add_on_set_parameters_callback` 이 없어 `ros2 param set` 이 **성공을 반환하면서
  #   거동은 바뀌지 않는다**(2026-08-10 실측 확인). 값을 바꾸려면 이 파일을 고치고 노드를
  #   재기동해야 한다. spin 은 콜백이 있어(`spin_action_server.cpp:38`) 일부 키가 hot-reload 된다.
  ros__parameters:
    # ── Platform (trnav_2ws_core::loadGeometry) ──
    platform: "QD_DIAGONAL"

    # ── 로봇 기하 — Foil_A082 실측 (2026-08-05 적용) ──────────────────────
    # 종전 값(w1 +0.330/+0.135 · w2 −0.330/−0.135 · r 0.080 · gear 20)은
    # **Carrier AGV(Automated Guided Vehicle) 원본**이 QD 스택에서 이식될 때 그대로 남은
    # 것이었다. 본 기체는 대각(diagonal)이 아니라 **inline dual-steer(2WS)** 다 — y 가
    # ±0.135 가 아니라 ≈0(센터라인)이며, 휠베이스는 0.660 m 가 아니라 **1.200 m** 다.
    # 정본: trnav_2ws_core/config/robot_geometry_2ws.yaml (Seer live_models 추출값,
    #       References/Tongyi-Motor-Controller/docs/tongyi-canopen-protocol-reference.md:11-15
    #       의 ±0.604/−0.596 · wheelRadius 0.125 · reduction 32 와 일치).
    # 정본 대조는 Tools/motion_chain_check/check_chain_contract.py C6 이 매 실행마다 수행한다.
    # ⚠ body_length/body_width 는 코드가 읽지 않는다(참조 0건) — Carrier AGV 값 그대로 둔다.
    body_length: 1.1974
    body_width: 0.648
    w1_x: 0.6039
    # ⚠ 2026-08-06 — y 를 **0 으로 확정**(사용자: 「2WS 는 구조상 제자리 스핀이므로 무조건 90도」).
    #   종전 값 −0.0014 m 는 Seer live_models 추출 시의 **실측 잔차**이며 설계값이 아니다.
    #   두 바퀴가 같은 y 를 가지면 그 값은 기구학에서 **가정하는 회전중심을 횡으로 y 만큼
    #   옮기는** 역할만 한다 — 바퀴가 센터라인에 있으므로 자연스러운 회전중심도 그 선 위(y=0)다.
    #   잔차를 남기면 제자리 스핀이 ±89.867° 로 나와 구조값 ±90° 와 어긋난다.
    #   다른 기동 영향은 미미하다(turn R=1.0 m 에서 0.036°, R=0.2 m 에서 0.12°).
    w1_y: 0.0
    w2_x: -0.5961
    w2_y: 0.0
    wheel_radius: 0.125
    steer_limit_deg: 90.0
    gear_walk: 32.0

    # ── ActionServerBase 공통 ──
    control_rate_hz: 50.0
    steer_tolerance_deg: 1.0
    steer_timeout_sec: 5.0

    # ── YawControl PID 기본값 (ROS1 원본 기준, HIL 후 튜닝) ──
    # 참고: counter_steer=true 시 omega=2*vx*tan(delta)/L 이므로 Kp 절반 권장
    # counter_steer=false (전륜만): Kp=0.5, Kd=0.1, Ki=0.0
    # counter_steer=true  (4WS):   Kp=0.25, Kd=0.05, Ki=0.0
    # 실제 게인은 goal에서 직접 지정하므로 이 값은 참고용

    # ── YawControl 파라미터 ──
    # 최종 헤딩 오차 허용[deg] — 거리는 채웠는데 헤딩이 이만큼 틀어져 있으면 status −9 로
    # 중단한다. **정확도 규격이 아니라 조용한 실패 가드**다: 조향이 죽어 직진만 하면 IMU 와
    # 맵이 둘 다 「안 돌았다」로 일치해 −7 이 뜨지 않고, 거리만 채우면 성공으로 보고됐다.
    yaw_control_final_yaw_tolerance_deg: 10.0
    yaw_control_enable_final_yaw_check: true

    yaw_control_max_timeout_sec: 60.0
    yaw_control_walk_accel_limit: 0.5
    yaw_control_walk_decel_limit: 1.0
    yaw_control_steer_rate_limit: 0.35
    yaw_control_min_vx: 0.02   # vx_profile floor (m/s) — 시작 시 정지 방지 (translate_min_vx 동일 패턴)

    # ── LocalizationMonitor ──
    # ── 조대(粗大) 헤딩 발산 탐지 ──
    # 제어 소스는 IMU 그대로다. 측위 heading 은 정밀도가 낮아 미세 제어에 쓰면 오히려 나빠지므로
    # **고장 탐지에만** 쓴다 — |보정 yaw − 맵 yaw| 임계 초과가 연속되면 status −7 로 abort.
    # 임계 5.0° 는 제어 목표가 아니라 **고장 경계**다. 정상 괴리는 시작 0.09° · 주행 0.25° 이고
    # 실제 고장 사례는 25° 였다 — 100배 격차라 그 사이 아무 값이나 오탐·미탐 없이 동작한다.
    # 근거·설계: docs/adr/2026-08-10-yaw-control-heading-divergence-guard.md
    yaw_control_enable_heading_divergence_guard: true
    yaw_control_heading_divergence_deg: 5.0
    yaw_control_heading_divergence_count: 10   # 연속 cycle (50 Hz 기준 0.2 s)

    # ── 조향 미도달 지속 감시 ──
    # gate_blocked(조향 오차로 구동 0)은 정상 안전 동작이지만 조향축이 비응답이면 영원히
    # 안 풀린다. 임계는 **정상 조향 이동 시간보다 길게** — 실측상 0→31° 이동에 약 3 초.
    # steer_timeout_sec 와 같은 의미(조향이 목표에 닿는 데 허용하는 시간)라 같은 값을 쓴다.
    # 근거·설계: docs/adr/2026-08-10-yaw-control-gate-blocked-guard.md
    yaw_control_gate_blocked_timeout_sec: 5.0

    yaw_control_pose_topic: "/robot_pose"  # Phase2(2026-06-09): 코드가 이제 사용(이전 dead, /rtabmap/localization_pose 는 타입불일치 미수신값이었음). 실차 fused 교체는 yaw_control.launch.py override
    # ⚠ 2026-08-09 제거: `yaw_control_pose_qos` — 코드 참조 0건인 죽은 손잡이였다.
    #   실제 pose 구독 QoS 는 RELIABLE 고정이며 yaml 로 바꿀 수 없다.
    #   「dead param」이라 주석만 달아 두면 다음 사람이 그래도 만져 보게 되므로 키를 없앤다.
    yaw_control_localization_timeout_sec: 2.0
    yaw_control_position_jump_threshold: 0.3
    yaw_control_enable_localization_watchdog: true

    # ── TransientGuard ──
    transient_vy_rate_limit: 0.3
    transient_omega_rate_limit: 0.5
    transient_steer_gate_threshold_deg: 3.0
    transient_steer_error_max_deg: 10.0
    transient_enable_proportional_decel: true
    transient_runtime_gate_threshold_deg: 15.0

    # ⚠ 2026-08-10 삭제: `yaw_control_max_steer_deg` · `yaw_control_i_max_deg`
    #   읽는 코드가 0건인 죽은 키였다(해당 값은 goal 필드로 준다). 설명 주석으로 남기지 않고
    #   **키 자체를 없앤다** — 이제 그 이름으로 set 하면 "parameter not declared" 로 즉시 드러난다.

