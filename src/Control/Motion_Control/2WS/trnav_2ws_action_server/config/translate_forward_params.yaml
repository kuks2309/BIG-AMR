/trnav_translate_forward_node:
  ros__parameters:
    # ⚠ `translate_pose_topic` 키는 삭제했다 — **코드가 읽지 않는 죽은 키**였고(`lm_params.pose_topic` 미설정),
    #   값 `/rtabmap/localization_pose` 는 발행자 0 인 토픽이었다(2026-08-06 실측).
    #   자세 토픽을 바꾸려면 **런치 인자**를 쓴다: `pose_topic:=/seer/robot_pose`
    # ── Platform (trnav::motion::two_ws::TwoWsActionServerBase::loadGeometry — trnav_2ws_motion/include/trnav_2ws_motion/qd_action_server_base.hpp) ──
    platform: "QD_DIAGONAL"

    # ── 로봇 기하 — Foil_A082 실측 (2026-08-05 적용) ──────────────────────
    # 종전 값(w1 +0.330/+0.135 · w2 −0.330/−0.135 · r 0.080 · gear 20)은
    # **Carrier AGV(Automated Guided Vehicle) 원본**이 QD 스택에서 이식될 때 그대로 남은
    # 것이었다. 본 기체는 대각(diagonal)이 아니라 **inline dual-steer(2WS)** 다 — y 가
    # ±0.135 가 아니라 ≈0(센터라인)이며, 휠베이스는 0.660 m 가 아니라 **1.200 m** 다.
    # 정본: trnav_2ws_core/config/robot_geometry_2ws.yaml (Seer live_models 추출값,
    #       References/Tongyi-Motor-Controller/docs/tongyi-canopen-protocol-reference.md:42-46
    #       의 ±0.604/−0.596 · wheelRadius 0.125 · reduction 32 와 일치).
    # 정본 대조는 Tools/motion_chain_check/check_chain_contract.py C6 이 매 실행마다 수행한다.
    # ⚠ body_length/body_width 는 코드가 읽지 않는다(참조 0건) — Carrier AGV 값 그대로 둔다.
    body_length: 1.1974
    body_width: 0.648
    w1_x: 0.6039
    # ⚠ 2026-08-06 — y 를 **0 으로 확정**(사용자: 「2WS 는 구조상 제자리 스핀이므로 무조건 90도」).
    #   종전 값 −0.0014 m 는 Seer live_models 추출 시의 **실측 잔차**이며 설계값이 아니다.
    #   두 바퀴가 같은 y 를 가지면 그 값은 기구학에서 **가정하는 회전중심을 횡으로 y 만큼
    #   옮기는** 역할만 한다 — 바퀴가 센터라인에 있으므로 자연스러운 회전중심도 그 선 위(y=0)다.
    #   잔차를 남기면 제자리 스핀이 ±89.867° 로 나와 구조값 ±90° 와 어긋난다.
    #   다른 기동 영향은 미미하다(turn R=1.0 m 에서 0.036°, R=0.2 m 에서 0.12°).
    w1_y: 0.0
    w2_x: -0.5961
    w2_y: 0.0
    wheel_radius: 0.125
    steer_limit_deg: 90.0
    gear_walk: 32.0

    # ── ActionServerBase 공통 ──
    control_rate_hz: 50.0
    steer_tolerance_deg: 1.0
    steer_timeout_sec: 5.0

    # ── PathController(BICYCLE) ──
    translate_Kp_heading: 0.7
    translate_Kd_heading: 0.3
    translate_K_stanley: 6.0
    translate_K_soft: 1.0
    translate_heading_threshold_deg: 90.0
    translate_max_lateral_offset: 1.0
    translate_heading_filter_window: 5
    # heading yaw 소스: 0=robot_pose(기본) / 1=IMU(시작 RMA10 offset 후 고정). A/B 실험용. x,y(CTE)는 항상 pose.
    translate_heading_source: 0
    translate_cte_filter_window: 5
    translate_max_delta_deg: 45.0

    # Wave 4 default: BICYCLE(=1). Goal control_mode=0 → default, =1 → BICYCLE.
    # Mode 2/3 은 후속 Wave 에서 활성화.
    translate_control_mode: 1

    # ── TransientGuard ──
    transient_vy_rate_limit: 0.3
    transient_omega_rate_limit: 0.5
    transient_steer_gate_threshold_deg: 3.0
    transient_steer_error_max_deg: 10.0
    transient_steer_error_deadband_deg: 2.0   # 불감대 — 측위 잡음발 조향 오차(≤2°)에는 구동을 깎지 않음
    transient_enable_proportional_decel: true
    transient_runtime_gate_threshold_deg: 90.0

    # ── LocalizationMonitor ──
    translate_pose_qos: 2                       # 0=default 1=reliable 2=sensor_data
    translate_localization_timeout_sec: 2.0
    translate_position_jump_threshold: 0.3
    translate_enable_localization_watchdog: true

    # ── Translate execute 파라미터 ──
    translate_goal_reach_threshold: 0.05
    translate_min_vx: 0.02
    translate_behind_start_speed: 0.2
    translate_vy_ramp_time: 1.0
    translate_max_timeout_sec: 60.0
    translate_steer_rate_static: 0.140
    translate_steer_rate_dynamic: 0.350
    translate_steer_rate_vx_threshold: 0.05
    translate_walk_accel_limit: 0.5
    translate_walk_decel_limit: 1.0
    translate_steer_converge_err_low_deg: 3.0
    translate_steer_converge_err_high_deg: 30.0
    translate_steer_converge_min_scale: 0.3
