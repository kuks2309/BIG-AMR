/trnav_line_follow_node:
  ros__parameters:
    # ── 기체 기하 (인라인 듀얼스티어 Foil_A082) ──
    # 베이스가 이 값으로 IK·자전거 모형을 만든다. 빠지면 QD 대각 기본값으로 조용히 풀리므로
    # (2026-08-08 실증) 반드시 함께 준다.
    # platform 은 **바퀴 배열 순서**를 고르는 값이지 배치 기하가 아니다 — QD_DIAGONAL 은
    # 「2륜, [0]=W1 · [1]=W2」를 뜻하며 인라인 기체도 이 값을 쓴다(turn_params.yaml 등 동일).
    # 실제 배치는 아래 w1/w2 좌표가 정한다.
    platform: "QD_DIAGONAL"
    w1_x: 0.6039
    w1_y: 0.0
    w2_x: -0.5961
    w2_y: 0.0
    wheel_radius: 0.125
    gear_walk: 32.0

    control_rate_hz: 50.0
    steer_tolerance_deg: 1.0
    steer_timeout_sec: 5.0

    # ── 공통분: 진행 방향 제어 (영상 횡오차·기울기 → 앞뒤 공통 조향각) ──
    # kp_offset·kd_offset 은 원본(2WD 차동)의 각속도 PD 를 조향각 공간으로 옮긴 값이라
    # 이 기체에서는 **출발점일 뿐** — 실기 재조정 대상이다.
    # kp_angle 만은 기하가 정한다: L/(2·lookahead) = 1.2/(2·1.0) = 0.6.
    line_follow_kp_offset: 1.2         # 횡오차 P (rad steer per unit offset)
    line_follow_kd_offset: 0.15        # 횡오차 D
    line_follow_kp_angle: 0.6          # 라인 기울기 P (rad steer per rad)
    line_follow_max_steer_deg: 25.0    # 공통분·차이분 각각의 포화
    line_follow_slow_gain: 0.7         # 커브 감속 v = v_max*(1 - slow*|offset|)

    # ── 차이분: 차체 heading 제어 (앞뒤 조향각 차) ──
    # heading_mode=0(FOLLOW_LINE)에서 차이분은 되먹임이 아니라 **곡률 환산**이다. 라인을
    # 정확히 타고 있어도 angle = −κ·d 로 남기 때문이다. 필요한 앞뒤 차는 κ·L 이고
    # κ = −angle/d 이므로 계수는 L/lookahead = 1.2/1.0 = 1.2 (= 2·kp_angle).
    # 이 2배 관계가 맞아야 곡선에서 crab 성분 없이 순수 counter-steer 가 된다.
    line_follow_k_curve_heading: 1.2
    # heading_mode=1(HOLD)·2(ABSOLUTE)에서만 쓰는 yaw 오차 되먹임.
    line_follow_kp_heading: 1.0        # heading P (rad 차이분 per rad 오차)
    line_follow_kd_heading: 0.1        # heading D

    # ── 곡선 편향 보상 ──
    # 전방주시는 곡선에서 완벽히 추종해도 offset 이 0 이 아니다(주시점이 원호에서 d²/2R 만큼
    # 벗어난다). 그 편향은 angle 에 비례하며 계수는 lookahead/(2·기준행 반폭) 이다.
    # SIL 기하(주시 1.0 m, 반폭 0.6 m)에서 0.8333. 실카메라 기하가 확정되면 그 값으로 바꾼다.
    line_follow_curve_bias_gain: 0.8333

    # ── 속도 ramp ──
    line_follow_accel: 0.3             # 가속 (m/s^2)
    line_follow_coast_decel: 0.15      # 소실 coast 감속 (m/s^2)
    line_follow_stop_decel: 0.5        # 정지 감속 (m/s^2)

    # ── 소실·두절 ──
    line_follow_conf_threshold: 0.5        # 추종·재개 최소 신뢰도
    line_follow_resume_max_offset: 0.9     # coast 재개 허용 |offset| (가장자리 오검출 배제)
    line_follow_wait_line_timeout_sec: 3.0 # 시작 시 라인 대기 한도
    line_follow_input_stale_timeout_sec: 0.5  # /line/error 두절 임계 — 유예 없이 정지
    line_follow_offset_filter_window: 5    # offset 이동평균 창

    # ── 방향 ↔ 카메라 정합 검사 ──
    # line_vision 로스터의 위치 논리명과 같아야 한다. 불일치하면 abort(-11).
    line_follow_forward_camera: "cam_f"
    line_follow_reverse_camera: "cam_r"

    # ── 지령 변화율 제한·가드 (yaw_control 과 같은 역할) ──
    # steer_rate_limit 은 SIL 스윕으로 정했다: 0.15 rad/s 이하에서 조향이 오차를 따라가지
    # 못해 진동하고(반전 4회·peak |offset| 0.98), 0.25~1.2 는 평탄, 2.0 은 다시 나빠진다.
    # 무릎(0.25)에서 3.2배 여유를 두고 0.8 을 쓴다. 이 무릎은 1.0·0.3 m/s 에서 같았다 —
    # 속도가 아니라 조향축 자체의 응답이 정한다.
    line_follow_steer_rate_limit: 0.8
    line_follow_walk_accel_limit: 0.5
    line_follow_walk_decel_limit: 1.0
    line_follow_gate_blocked_timeout_sec: 5.0

    # 전역 시한만 yaw_control(60)보다 길다 — 목표 거리로 소요를 예측할 수 있는 그쪽과 달리
    # 라인 추종은 라인 길이가 곧 주행 시간이라 짧은 시한이 정상 주행을 끊는다.
    line_follow_max_timeout_sec: 120.0

    # ── 측위 ──
    line_follow_enable_localization_watchdog: true
    line_follow_pose_topic: "/robot_pose"
    line_follow_localization_timeout_sec: 2.0
    line_follow_position_jump_threshold: 0.3

    # ── mux ──
    line_follow_motion_source_id: 13
    # 소스 전환 실패 시 abort(-13). false 로 내리면 경고만 하고 진행한다 — mux 없이 도는
    # SIL·벤치 전용이며, 실기에서 false 로 두면 「안 움직였는데 성공」을 보고할 수 있다.
    line_follow_require_motion_source: true
