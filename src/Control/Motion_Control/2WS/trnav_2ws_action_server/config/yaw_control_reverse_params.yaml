/trnav_yaw_control_reverse_node:
  ros__parameters:
    # ── Platform (trnav_2ws_core::loadGeometry) ──
    platform: "QD_DIAGONAL"

    # ── 로봇 기하 — Foil_A082 실측 (2026-08-05 적용) ──────────────────────
    # 종전 값(w1 +0.330/+0.135 · w2 −0.330/−0.135 · r 0.080 · gear 20)은
    # **Carrier AGV(Automated Guided Vehicle) 원본**이 QD 스택에서 이식될 때 그대로 남은
    # 것이었다. 본 기체는 대각(diagonal)이 아니라 **inline dual-steer(2WS)** 다 — y 가
    # ±0.135 가 아니라 ≈0(센터라인)이며, 휠베이스는 0.660 m 가 아니라 **1.200 m** 다.
    # 정본: trnav_2ws_core/config/robot_geometry_2ws.yaml (Seer live_models 추출값,
    #       References/Tongyi-Motor-Controller/docs/tongyi-canopen-protocol-reference.md:11-15
    #       의 ±0.604/−0.596 · wheelRadius 0.125 · reduction 32 와 일치).
    # 정본 대조는 Tools/motion_chain_check/check_chain_contract.py C6 이 매 실행마다 수행한다.
    # ⚠ body_length/body_width 는 코드가 읽지 않는다(참조 0건) — Carrier AGV 값 그대로 둔다.
    body_length: 1.1974
    body_width: 0.648
    w1_x: 0.6039
    # ⚠ 2026-08-06 — y 를 **0 으로 확정**(사용자: 「2WS 는 구조상 제자리 스핀이므로 무조건 90도」).
    #   종전 값 −0.0014 m 는 Seer live_models 추출 시의 **실측 잔차**이며 설계값이 아니다.
    #   두 바퀴가 같은 y 를 가지면 그 값은 기구학에서 **가정하는 회전중심을 횡으로 y 만큼
    #   옮기는** 역할만 한다 — 바퀴가 센터라인에 있으므로 자연스러운 회전중심도 그 선 위(y=0)다.
    #   잔차를 남기면 제자리 스핀이 ±89.867° 로 나와 구조값 ±90° 와 어긋난다.
    #   다른 기동 영향은 미미하다(turn R=1.0 m 에서 0.036°, R=0.2 m 에서 0.12°).
    w1_y: 0.0
    w2_x: -0.5961
    w2_y: 0.0
    wheel_radius: 0.125
    steer_limit_deg: 90.0
    gear_walk: 32.0

    # ── ActionServerBase 공통 ──
    control_rate_hz: 50.0
    steer_tolerance_deg: 1.0
    steer_timeout_sec: 5.0

    # ── YawControlReverse 파라미터 (yaw_control 과 동일 구조, prefix 만 다름) ──
    # vx_max 는 magnitude(>0) 로 받고 내부에서 항상 -vx 적용 — yaml 파라미터엔 영향 없음.
    # 최종 헤딩 오차 허용[deg] — 거리는 채웠는데 헤딩이 이만큼 틀어져 있으면 status −9 로
    # 중단한다. **정확도 규격이 아니라 조용한 실패 가드**다: 조향이 죽어 직진만 하면 IMU 와
    # 맵이 둘 다 「안 돌았다」로 일치해 −7 이 뜨지 않고, 거리만 채우면 성공으로 보고됐다.
    yaw_control_reverse_final_yaw_tolerance_deg: 10.0
    yaw_control_reverse_enable_final_yaw_check: true

    yaw_control_reverse_max_timeout_sec: 60.0
    yaw_control_reverse_walk_accel_limit: 0.5
    yaw_control_reverse_walk_decel_limit: 1.0
    yaw_control_reverse_steer_rate_limit: 0.35
    yaw_control_reverse_min_vx: 0.02   # vx_profile floor magnitude (m/s) — 시작 시 정지 방지

    # ── LocalizationMonitor ──
    yaw_control_reverse_pose_topic: "/robot_pose"   # ⚠ 2026-08-10 정정: 종전 "/rtabmap/localization_pose" 는 **실재하지 않는 토픽**이었고,
                                       #   게다가 코드가 이 키를 읽지도 않아(죽은 키) 기본값 /robot_pose 로 동작했다.
                                       #   코드에 읽는 줄을 추가하고 값을 사실에 맞췄다.
    yaw_control_reverse_localization_timeout_sec: 2.0
    yaw_control_reverse_position_jump_threshold: 0.3
    yaw_control_reverse_enable_localization_watchdog: true

    # ── TransientGuard ──
    transient_vy_rate_limit: 0.3
    transient_omega_rate_limit: 0.5
    transient_steer_gate_threshold_deg: 3.0
    transient_steer_error_max_deg: 10.0
    transient_enable_proportional_decel: true
    transient_runtime_gate_threshold_deg: 15.0

    # ⚠ 2026-08-10 삭제: `yaw_control_reverse_max_steer_deg` · `yaw_control_reverse_i_max_deg` · `yaw_control_reverse_pose_qos`
    #   읽는 코드가 0건인 죽은 키였다(해당 값은 goal 필드로 준다). 설명 주석으로 남기지 않고
    #   **키 자체를 없앤다** — 이제 그 이름으로 set 하면 "parameter not declared" 로 즉시 드러난다.

    # ── 고장 탐지 (전진판과 동일 규약) ──
    # 제어 소스는 IMU 그대로. 임계는 제어 목표가 아니라 고장 경계다.
    # 근거: docs/adr/2026-08-10-yaw-control-heading-divergence-guard.md
    #       docs/adr/2026-08-10-yaw-control-gate-blocked-guard.md
    yaw_control_reverse_enable_heading_divergence_guard: true
    yaw_control_reverse_heading_divergence_deg: 5.0
    # ⚠ 단위는 **제어 cycle 이 아니다** — 제어는 50 Hz 인데 실차 /robot_pose 는 10 Hz 라
    #   cycle 을 세면 같은 pose 를 5 번 세게 되어 「10 연속」이 실제로는 샘플 2개였다.
    yaw_control_reverse_heading_divergence_count: 10
    yaw_control_reverse_gate_blocked_timeout_sec: 5.0
