/trnav_mpc_reverse_node:
  ros__parameters:
    # ⚠ `mpc_pose_topic` 키는 삭제했다 — **코드가 읽지 않는 죽은 키**였고(`lm_params.pose_topic` 미설정),
    #   값 `/rtabmap/localization_pose` 는 발행자 0 인 토픽이었다(2026-08-06 실측).
    #   자세 토픽을 바꾸려면 **런치 인자**를 쓴다: `pose_topic:=/seer/robot_pose`
    # ── Platform ──
    platform: "QD_DIAGONAL"

    # ── 로봇 기하 ──
    body_length: 1.1974
    body_width: 0.648
    w1_x: 0.6039
    # ⚠ 2026-08-06 — y 를 **0 으로 확정**(사용자: 「2WS 는 구조상 제자리 스핀이므로 무조건 90도」).
    #   종전 값 −0.0014 m 는 Seer live_models 추출 시의 **실측 잔차**이며 설계값이 아니다.
    #   두 바퀴가 같은 y 를 가지면 그 값은 기구학에서 **가정하는 회전중심을 횡으로 y 만큼
    #   옮기는** 역할만 한다 — 바퀴가 센터라인에 있으므로 자연스러운 회전중심도 그 선 위(y=0)다.
    #   잔차를 남기면 제자리 스핀이 ±89.867° 로 나와 구조값 ±90° 와 어긋난다.
    #   다른 기동 영향은 미미하다(turn R=1.0 m 에서 0.036°, R=0.2 m 에서 0.12°).
    w1_y: 0.0
    w2_x: -0.5961
    w2_y: 0.0
    wheel_radius: 0.125
    steer_limit_deg: 90.0
    gear_walk: 32.0

    # ── ActionServerBase 공통 ──
    control_rate_hz: 50.0
    steer_tolerance_deg: 1.0
    steer_timeout_sec: 5.0

    # ── MPC 알고리즘 파라미터 (forward 와 동일) ──
    mpc_lookahead_distance: 0.4
    mpc_max_lateral_offset: 1.0
    mpc_heading_threshold_deg: 90.0
    mpc_cte_filter_window: 1
    mpc_max_delta_deg: 45.0

    # ── TransientGuard ──
    transient_vy_rate_limit: 0.3
    transient_omega_rate_limit: 0.5
    transient_steer_gate_threshold_deg: 3.0
    transient_steer_error_max_deg: 10.0
    transient_enable_proportional_decel: true
    transient_runtime_gate_threshold_deg: 90.0

    # ── LocalizationMonitor ──
    mpc_pose_qos: 2
    mpc_localization_timeout_sec: 2.0
    mpc_position_jump_threshold: 0.3
    mpc_enable_localization_watchdog: true

    # ── execute 파라미터 ──
    mpc_goal_reach_threshold: 0.05
    mpc_min_vx: 0.02
    mpc_behind_start_speed: 0.2
    mpc_max_timeout_sec: 60.0
    mpc_steer_rate_static: 0.140
    mpc_steer_rate_dynamic: 0.350
    mpc_steer_rate_vx_threshold: 0.05
    mpc_walk_accel_limit: 0.5
    mpc_walk_decel_limit: 1.0
    mpc_steer_converge_err_low_deg: 3.0
    mpc_steer_converge_err_high_deg: 30.0
    mpc_steer_converge_min_scale: 0.3
