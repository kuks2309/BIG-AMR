/trnav_crab_linear_node:
  ros__parameters:
    # ── Platform (trnav::motion::two_ws::TwoWsActionServerBase::loadGeometry — trnav_2ws_motion/include/trnav_2ws_motion/qd_action_server_base.hpp) ──
    platform: "QD_DIAGONAL"

    # ── 로봇 기하 — Foil_A082 실측 (2026-08-05 적용) ──────────────────────
    # 종전 값(w1 +0.330/+0.135 · w2 −0.330/−0.135 · r 0.080 · gear 20)은
    # **Carrier AGV(Automated Guided Vehicle) 원본**이 QD 스택에서 이식될 때 그대로 남은
    # 것이었다. 본 기체는 대각(diagonal)이 아니라 **inline dual-steer(2WS)** 다 — y 가
    # ±0.135 가 아니라 ≈0(센터라인)이며, 휠베이스는 0.660 m 가 아니라 **1.200 m** 다.
    # 정본: trnav_2ws_core/config/robot_geometry_2ws.yaml (Seer live_models 추출값,
    #       References/Tongyi-Motor-Controller/docs/tongyi-canopen-protocol-reference.md:42-46
    #       의 ±0.604/−0.596 · wheelRadius 0.125 · reduction 32 와 일치).
    # 정본 대조는 Tools/motion_chain_check/check_chain_contract.py C6 이 매 실행마다 수행한다.
    # ⚠ body_length/body_width 는 코드가 읽지 않는다(참조 0건) — Carrier AGV 값 그대로 둔다.
    body_length: 1.1974
    body_width: 0.648
    w1_x: 0.6039
    # ⚠ 2026-08-06 — y 를 **0 으로 확정**(사용자: 「2WS 는 구조상 제자리 스핀이므로 무조건 90도」).
    #   종전 값 −0.0014 m 는 Seer live_models 추출 시의 **실측 잔차**이며 설계값이 아니다.
    #   두 바퀴가 같은 y 를 가지면 그 값은 기구학에서 **가정하는 회전중심을 횡으로 y 만큼
    #   옮기는** 역할만 한다 — 바퀴가 센터라인에 있으므로 자연스러운 회전중심도 그 선 위(y=0)다.
    #   잔차를 남기면 제자리 스핀이 ±89.867° 로 나와 구조값 ±90° 와 어긋난다.
    #   다른 기동 영향은 미미하다(turn R=1.0 m 에서 0.036°, R=0.2 m 에서 0.12°).
    w1_y: 0.0
    w2_x: -0.5961
    w2_y: 0.0
    wheel_radius: 0.125
    steer_limit_deg: 90.0
    gear_walk: 32.0

    # ── ActionServerBase 공통 ──
    control_rate_hz: 50.0
    steer_tolerance_deg: 1.0
    steer_timeout_sec: 5.0

    # ── mux source ──
    motion_source_id: 4

    # ── PathController (projection / e_d / e_theta 측정 + heading PD 게인) ──
    # crab_linear 은 PathController 의 δ_f/δ_r 출력은 사용하지 않고,
    # Kp_heading/Kd_heading 만 target_yaw - robot_yaw 추종용 PD 로 사용한다.
    # 2026-05-24: 본 프로젝트 translate_forward_params.yaml 게인 적용 (사용자 결정)
    #   - Kp_heading 1.0 → 0.7 (translate_forward 와 동일, 원본 1.5 응답성 추구 X)
    #   - heading_threshold_deg 45 → 90 (translate_forward 와 동일)
    crab_linear_Kp_heading: 0.7
    crab_linear_Kd_heading: 0.3
    crab_linear_K_stanley: 2.0
    crab_linear_K_soft: 1.0
    crab_linear_max_lateral_offset: 1.0
    crab_linear_heading_filter_window: 5
    crab_linear_cte_filter_window: 5
    crab_linear_max_delta_deg: 45.0

    # heading abort (target_yaw - robot_yaw 초과 시 status=-4)
    crab_linear_heading_threshold_deg: 90.0

    # ── TransientGuard ──
    transient_vy_rate_limit: 0.3
    transient_omega_rate_limit: 0.5
    transient_steer_gate_threshold_deg: 3.0
    transient_steer_error_max_deg: 10.0
    transient_enable_proportional_decel: true
    transient_runtime_gate_threshold_deg: 90.0

    # ── LocalizationMonitor ──
    crab_linear_localization_timeout_sec: 2.0
    crab_linear_position_jump_threshold: 0.3
    crab_linear_enable_localization_watchdog: true

    # ── execute 파라미터 ──
    crab_linear_goal_reach_threshold: 0.05
    crab_linear_min_vx: 0.02
    crab_linear_behind_start_speed: 0.2
    crab_linear_max_timeout_sec: 60.0
    crab_linear_steer_rate_static: 0.140
    crab_linear_steer_rate_dynamic: 0.350
    crab_linear_steer_rate_vx_threshold: 0.05
    crab_linear_walk_accel_limit: 0.5
    crab_linear_walk_decel_limit: 1.0
    crab_linear_steer_converge_err_low_deg: 3.0
    crab_linear_steer_converge_err_high_deg: 30.0
    crab_linear_steer_converge_min_scale: 0.3
