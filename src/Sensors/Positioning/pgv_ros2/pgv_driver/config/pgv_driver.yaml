pgv_driver:
  ros__parameters:
    serial_port: /dev/ttyUSB0
    baudrate: 115200            # 장치 preset (매뉴얼 §2.2). 38400/57600/115200/230400 만 지원
    address: 0                  # 읽기 헤드 주소 0..3 (코드 카드로 설정, §6.1.2)
    poll_rate_hz: 20.0
    serial_timeout_ms: 50
    # ⚠ 스케일은 장치 설정과 일치 필수 — 코드 카드(§6.1.3)/Vision Configurator 로 설정한
    # 값을 그대로 적는다. 공장 preset 은 매뉴얼에 서술이 없어 실기에서 확인해야 한다.
    position_resolution_mm: 0.1   # 0.1 / 1.0 / 10.0
    angle_resolution_deg: 0.1     # DM 테이프 절대각: 0.1 / 0.2 / 0.5 / 1.0
    frame_id: pgv_link
