# 장비별 캘리브레이션 — Foil_A082 (Big-AMR 실기)
#
# 이 파일에 담기는 것은 **그 기체 고유의 물리값**뿐이다. 로직 파라미터(주기·타임아웃·토픽)는
# `../can_relay.yaml` 에 있다. 기체를 바꾸면 이 파일만 갈아끼운다.
#
# 스키마는 상류 `kuks2309/TR_Nav_ros2_ws` 의 `amr_canopen_motor_driver.yaml` 이름을 계승한다
# (대조·교체가 쉽도록). 상류가 코드에 박아 둔 두 가지 — 조향 한계(`can_open.hpp:463`)와
# 호밍 방식(`can_open.hpp:461` 고정 35) — 는 여기서 파라미터로 올렸다.
#
# ⚠ 값의 출처를 반드시 적을 것. 출처 없는 값은 다음 사람이 검증할 수 없다.

/**:
  ros__parameters:
    machine_name: "Foil_A082"

    # ── 스케일 ────────────────────────────────────────────────────────────
    # 조향 counts/도. 실측 근거: 홈↔90° Δ = +5,160,960 counts = 정확히 90.00°
    # (= 16384 × 4 × 315/360). ⚠ 상류 QD(Carrier AGV) 값 48,332.8 과 다르다 —
    # 상류 config 를 그대로 쓰면 안 된다.
    steer_counts_per_deg: 57344.0

    # 구동 raw 환산(0x60FF, 0.1 r/min 단위)과 상한.
    # ⚠ VEL_MAX_UNITS 는 실측이 아니라 config 환산 + 계승된 안전 상한이다.
    drive_units_per_mmps: 24.447
    drive_max_units: 4889              # ≈0.2 m/s

    # ── 호밍 ──────────────────────────────────────────────────────────────
    # "35"       = 상류식. can_relay 가 직접 지휘한다:
    #              0x607A=home_offset → 도착확인 → SDO 0x6098=35(현재위치를 홈으로).
    #              매뉴얼 Handbook §Home 35: "records the current motor position as the home
    #              position, sets the current angle to zero" → 호밍 후 0x6064 ≈ 0 이 직진.
    #              같은 절: "only effective when the motor is powered on" →
    #              **전원 사이클마다 재호밍 필수**.
    # "firmware" = 판다 시퀀서(0xea/0xeb). method 1(−리밋 탐색) + 펌웨어 상수 GOZERO.
    #              펌웨어 목표값이 이 기체 값일 때만 유효하다.
    # ❌ **"35" 는 이 로봇에서 쓸 수 없다 — 2026-08-01 18:2x 실기 시험으로 기각.**
    #    `0x6098=35` 송신은 성공했고 `0x6064` 가 7,871,810 → **-6** 으로 재영점됐다.
    #    그런데 제어권을 반환하는 순간 **Seer 가 조향을 130.55° 틀어진 것으로 읽고**
    #    되돌리려 **능동 구동을 시작했다**(130.55° → 123.19° → 115.97°, 약 4.9°/s).
    #    3톤 차체가 실제로 돌기 시작해 긴급히 제어권을 재획득(emulate 로 Seer write 차단)했다.
    #    이후 엔코더 기준이 원래 절대 스케일로 복귀했고, 제어권 반환 후 Seer 가 ≈0° 로
    #    안정됐다(총 이동 0.049°).
    #    ⇒ **Seer 가 살아 있는 아키텍처에서 재영점은 Seer 를 desync 시키고 로봇을 움직인다.**
    #      상류 `TR_Nav` 는 Seer 가 없는 구성이라 method 35 가 성립했던 것이다.
    #    근거: `docs/adr/2026-08-01-can-relay-home-calibration-method35.md` (Superseded 예정)
    homing_method: "firmware"

    # method 35 에서 "어느 절대 카운트로 가서 홈을 걸 것인가". 기체 고유값이다.
    # 순서는 `steer_nodes` 와 같다 — [node3(front), node4(rear)].
    #
    # ✅ **실측 2026-08-01 18:0x** (판다 SILENT 수동청취 + Seer API 1040 동시 판독):
    #     node3  CAN 7,871,810c ↔ Seer +0.0001°  →  0° = 7,871,816c
    #     node4  CAN 7,839,894c ↔ Seer +0.0035°  →  0° = 7,840,095c
    #
    #   ⚠⚠ **정정 2026-08-02 — 위 0° 역산의 부호가 틀렸었다.**
    #     원래 `0° = CAN − Seer×57344` 로 적어 7,871,804 / 7,839,695 를 얻었으나,
    #     **Seer 각도와 CAN counts 는 음의 상관**이므로 `+` 가 맞다.
    #     근거(하루 간격 2점 회귀, 둘 다 SILENT 수동청취):
    #       node3  ΔCAN −2,818c ↔ ΔSeer +0.0488°  → 기울기 −1.732e-5 °/c
    #       node4  ΔCAN   +191c ↔ ΔSeer −0.0035°  → 기울기 −1.832e-5 °/c
    #       |기울기|×57,344 = 0.993 / 1.051 ≈ 1 → 스케일은 맞고 **부호만 반대**였다.
    #     검산: `−` 로 역산하면 두 측정의 0° 추정이 node3 에서 5,616c(0.098°) 어긋나고,
    #           `+` 로 하면 20c(0.0003°) / 10c(0.0002°) 로 수렴한다.
    #     ⚠ node4 의 기울기는 ΔSeer 가 0.0035° 뿐이라 **부호만 일치 확인, 스케일 정밀도는 낮다**.
    #     도구 `Tools/docking_field_kit/orin_steer_crosscheck.py` 도 같은 날 정정했다.
    #
    #   ⚠ **정정 2026-08-02 — "설정 호출 0건" 은 거짓이었다.**
    #     도구는 판다에 `set_safety_mode(0,0)`(SILENT) · 버스별 `set_can_speed_kbps` ·
    #     `set_can_enable` 를 호출한다(`orin_steer_crosscheck.py:121-125`).
    #     정확한 주장은 **「CAN 프레임 송신 0건」** 이다 — SILENT(safety_mode 0)가 판다의
    #     CAN 송신을 막고, 코드에도 `can_send*` 호출이 없다(AST 검사 0건).
    #     제어권은 취득하지 않는다 — 그래야 emulate 가 안 켜져 Seer 가 모터 실측을 본다
    #     (`safety_seer_gate.h:164`).
    #
    # ⚠ 범위 주의: Seer 의 `position` 도 Seer 자신의 캘리브레이션을 거친 값이다.
    #   육안으로 바퀴를 본 것이 아니므로 "물리적 직진"이 아니라 **"Seer 의 0° 기준"** 이다.
    #   내비게이션이 Seer 좌표계를 쓰므로 여기에 맞추는 것이 정합에 유리하다.
    #
    # 참고: 호밍 후 정착값(7,882,021 / 7,859,065, debt-007 그룹2)은 여기서 각각
    #   +10,206c(+0.178°) / +18,979c(+0.331°) 떨어져 있다 — 즉 **호밍은 0° 에 정확히
    #   놓지 않는다.** method 35 는 이 값으로 이동해 홈을 걸므로 그 편차를 제거한다.
    #   ❌ 정정 2026-08-03: 종전 표기 7,882,001 / +19,370c / +0.338° 는 오기다.
    #      2026-08-03 호밍 10회 실측 중앙값 기준(모σ 2.80 / 3.21).
    # ⚠ **정정 2026-08-01 18:2x — 실기 시험 결과 반영.**
    #   위 역산값(7,871,804 / 7,839,695)으로 1차 시험했으나 **node4 가 도착하지 못했다** —
    #   지령 199 counts(=0.0035°) 중 6 counts 만 움직이고 멈췄다. 3톤 차체의 조향
    #   정지마찰·드라이브 분해능 아래라 **물리적으로 갈 수 없는 거리**였다.
    #   ⚠⚠ **재정정 2026-08-02**: 그 지령은 부호가 틀린 역산값이라 **방향까지 반대**였다
    #     (node4 는 7,840,095 로 갔어야 했는데 7,839,695 로 보냈다 — 부호 정정 참조).
    #     거리는 어느 쪽이든 ~200c 로 분해능 아래이므로 「도달 실패」자체는 같으나,
    #     **「정지마찰 때문」이라는 원인 설명은 입증된 것이 아니다** — 방향 오류가 섞여 있어
    #     이 시험으로는 원인을 가릴 수 없다. 미확정으로 되돌린다.
    #   (그때 도착 판정이 실패해 `0x6098=35` 는 송신되지 않았다 — 설계대로 안전 중단.)
    #   Seer 기준 0.0001°/0.0035° 오차는 측정 한계로 남기고, **현재 실측 위치를 그대로**
    #   홈 좌표로 삼는다. 매뉴얼 §Home 35 의 "the home point is *the current position*"
    #   취지와도 맞는다.
    # ══════════════════════════════════════════════════════════════════════
    # 조향 홈 (0°) — **이 파일이 유일 정본이다.**
    # 코드에는 기본값이 없다(`safety.DEFAULT_STEER_HOME = {}`). 값이 없으면 조향
    # 지령이 거부된다 — 조용한 오판보다 정지가 낫다. (2026-08-02 사용자 지시)
    #
    # ══ 정정 2026-08-03 ══ 이전 값 [7871810, 7839894] 는 **0° 가 아니라 raw 판독값**이었다.
    #
    # 0° 는 raw CAN 판독값이 아니라 **Seer 각도로 역산**해야 한다:
    #       0° = CAN_0x6064 + Seer_deg x 57344
    # 2026-08-02 종결은 이 식을 문서에 적어 놓고도 채택값에는 적용하지 않아,
    # Seer 가 0° 를 가리키지 않던 자세의 raw 판독값을 그대로 0° 로 박았다.
    #   · node3 은 그때 Seer 가 +0.0001° 라 오차가 6c 에 그쳐 드러나지 않았고,
    #   · node4 는 Seer 가 +0.0035° 여서 오차가 **193c** 로 드러났다.
    # 같은 문서의 3차 확인(2026-08-02 19:42)은 역산을 적용해 node4 0° = 7,840,085c 를
    # 얻고도 이를 "계통 편차 가능성(미판정)"으로 넘겼다 — 그 값이 정답이었다.
    #
    # 실측 확정 (2026-08-03 11:44, `Tools/docking_field_kit/orin_steer_crosscheck.py`,
    #   2회 독립 실행이 counts 단위까지 동일. 산출 Log/steer_xcheck_reboot_0deg*.jsonl):
    #   조건 — 판다 SAFETY_SILENT·passthrough(제어권 미취득)라 CAN 과 Seer 가 독립 경로.
    #          도구는 AST 구문트리 검사로 송신 API 호출 0건 확인.
    #          **사용자 확인: Seer 표시 앞바퀴 2축 모두 0°**  ⇒ 외삽이 거의 없는 이상적 조건.
    #   node3  CAN 7,871,823c (sigma=3, n=3110) · Seer -0.000° (sigma=0.000) -> 0° = 7,871,816c
    #   node4  CAN 7,840,052c (sigma=2, n=3110) · Seer +0.001° (sigma=0.000) -> 0° = 7,840,087c
    #
    # ⇒ 폐기 선언됐던 [7871815, 7840086] 이 **양 노드 모두 1c(0.000017°) 이내로 맞다.**
    #   「출처 없는 값」이라는 판정도 반증됐다 — 출처는 Seer 가 실시간으로 내는
    #   0x607A 조향 목표다(passthrough 캡처에서 연속 관측, docs/homing/2026-08-03-*.md 7-1).
    #
    # 재현성(유효): 2026-07-27~28 로그 5종 ~ 2026-08-01 ~ 2026-08-03 이 4일·전원 인가·
    #   플래시 8회를 사이에 두고 유지 → 절대 엔코더는 전원 사이클을 넘어 재현된다.
    # 0° 역산 3회 대조: 7,840,095(08-01 역산) · 7,840,085(08-02 3차) · 7,840,087(08-03 x2).
    #   채택 폐기값 7,839,894 만 홀로 떨어져 있었다 — 그것이 raw 판독값이었다는 증거다.
    #
    # ⚠ 남은 것: "Seer 의 0°" 와 "물리적 직진"이 같은지는 Seer 자체 캘리브레이션에 달려 있다.
    #   확정한 것은 **「Seer 가 0° 라 부르는 자세 <-> CAN counts」의 대응**이다.
    #
    # ❌ 혼동 금지: 7882020 / 7859062 는 **펌웨어 GOZERO 상수**(호밍 후 정착 목표)이며
    #   0° 가 아니다 — 0° 에서 +0.178° / +0.331° 벗어나 있다. 본 값과 별개 사안이다.
    #   (종전 +0.334° 는 폐기된 0° 기준으로 계산된 잔재 — 인용 금지)
    steer_home_counts: [7871815, 7840086]

    # method 35 전용(현재 기각). firmware 경로에서는 쓰이지 않는다.
    steer_home_offset: [7871815, 7840086]

    # ⚠ true 로 바꾸면 `~/home` 이 바퀴를 **물리적으로 움직인다**(위 좌표로 절대이동).
    #   3톤 차체이므로 이동구역 확인과 사용자 승인 후에만 켤 것.
    # 2026-08-04 사용자 결정으로 **유지**한다(「우리도 할 수 있으니 두는 것이 어떨까?」).
    # 근거: docs/verified_facts/2026-08-04-amr-test-gui-field-run.md:209-210, :313-318.
    # 조향 자체는 이 값과 무관하다(호밍 판정이 드라이브 0x6041 bit15 기준으로 바뀜).
    # 이 값이 정하는 것은 **`~/home` 을 우리가 호출할 수 있는가** 하나다 —
    # Seer 에만 맡기지 않고 필요할 때 직접 호밍할 수단을 남긴다. ⚠ 물리 스윙 100°+.
    homing_enabled: true

    # 호밍 도착 허용 오차(counts). 상류는 50 을 쓴다(can_open.hpp:489).
    home_reach_tol_counts: 50
    # 호밍 프로파일 속도(0x6081). 상류 HomeVelocity 와 같은 2500.
    home_profile_vel: 2500

    # 호밍 시작 전 현재 0x6064 가 이 범위 안에 있어야 진행한다.
    # **엔코더 기준이 통째로 달라졌는지 검출하는 장치다** — 기준이 어긋난 채 절대이동을
    # 하면 바퀴가 예상 밖으로 돈다. 여기서 걸어 움직이기 전에 멈춘다.
    #
    # 범위 근거 — 기존 호밍 로그 5종 전수 분석(2026-08-01, Log/*.jsonl):
    #   조향 직진 자세  node3 7,871,818~7,882,014 · node4 7,840,084~7,859,065
    #   조향 90° 자세   node3 13,040,590        · node4 12,993,527
    #   호밍 진행 중    0 고정(0x6041 bit15=0 구간)
    # 하한을 양수로 두어 "0 고정"과 "기준 리셋"을 걸러내고, 상한은 90° 자세 위로 여유를 둔다.
    # 2일·5세션에 걸쳐 관측값이 이 대역을 벗어난 적이 없다.
    home_search_range: [7000000, 14000000]

    # ── 안전 한계 ─────────────────────────────────────────────────────────
    # 크랩은 조향 90° + 바퀴 역회전으로도 같은 운동이 나오므로, ±90° 로 묶어
    # **이중해를 없앤다**(합의). 기구 한계(±140°)와는 다른 목적이다.
    # 상류는 ±130° 를 헤더에 하드코딩했다(can_open.hpp:463) — 우리는 여기서 조정 가능.
    steer_limit_deg: 90.0

    # ── 배선 ──────────────────────────────────────────────────────────────
    # motor_id 배정은 상류 `trnav_msgs/MotorCmd.msg` 와 동일하다:
    #   1=walk_front, 2=walk_rear, 3=steer_front, 4=steer_rear
    drive_nodes: [1, 2]
    steer_nodes: [3, 4]
