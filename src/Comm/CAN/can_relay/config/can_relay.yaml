# can_relay 파라미터. `/**` 와일드카드라 노드명·네임스페이스를 바꿔도 로드된다.
# (고정 노드명으로 키잉하면 리맵 시 조용히 미로드되고 코드 기본값이 그대로 나간다.)
/**:
  ros__parameters:
    link: "panda"                 # panda | mock — mock 은 하드웨어 무접속 시험용
    panda_serial: ""              # 2대 이상 보이면 반드시 지정(미지정 시 기동 거부)
    bus: 2                        # 판다 bus 2 = 드라이브 측. bus 0 은 Seer 측이다

    drive_nodes: [1, 2]           # 구동축(PV). 기계적 원점 없음 → 호밍 대상 아님
    steer_nodes: [3, 4]           # 조향축(PP)

    # ── 조향 홈은 여기 없다 ───────────────────────────────────────────────
    # 정본은 `config/machine/<기체>.yaml` 의 `steer_home_counts` 하나뿐이다.
    # 값이 두 곳에 있으면 어느 것이 실렸는지 알 수 없어 그 자체가 오판이 된다.
    # 코드에도 기본값이 없다(`safety.DEFAULT_STEER_HOME = {}`) — 없으면 조향 거부.
    # (2026-08-02 사용자 지시: "모터 홈은 중요하니 config 에서 설정하는 것이 맞다")

    # ⚠ **실효값은 여기가 아니다** — launch 가 machine_file 을 나중에 로드하므로
    #   `config/machine/<기체>.yaml` 의 값이 이긴다(can_relay.launch.py:41-42).
    #   기체 고유값이라 그쪽이 정본이다. 여기 값은 machine_file 미지정 시의 보수적 기본값.
    steer_limit_deg: 90.0

    # 벤치 직접 지령(`~/steer_deg`·`~/steer_axis_deg`) 전용 상한. **체인과 분리**한다.
    # can_relay 는 `/motor/low_cmd` 로 raw counts 만 받아 지령 출처를 모르므로
    # 「크랩일 때만 열기」를 판정할 수 없다. 대신 **경로**로 나눈다 —
    # 모션 체인은 크랩 여유(115°)를 쓰고, 사람이 손으로 넣는 경로는 90° 가드를 유지한다.
    # 기체 파일이 이 값을 덮지 않는 한 90° 다(machine yaml 에는 두지 않는다).
    steer_limit_bench_deg: 90.0
    vel_max_units: 4889           # ≈0.2 m/s. 실측이 아니라 config 환산 + 계승 상한
    cmd_timeout_s: 0.3            # 워치독. 갱신 없으면 속도 0 으로 수렴
    cmd_hz: 20.0                  # 지령 재송신 주기(단발 송신 금지)
    poll_hz: 5.0                  # 피드백 폴링
    settle_tol_deg: 3.0           # 조향 정착 허용치(양축 모두 만족해야 함)

    # 브링업 = **구동축 전용** 기동 시퀀스(0x6040=0x86 · 0x60FF=0 · 0x100C/0x100D · 0x6060=3 PV).
    # gui.py 에는 이 시퀀스가 없고(근거: 2026-07-29 실행
    #   `grep -nE '0x6060|0x100C|0x100D|0x6081|0x6083|0x6084' Tools/amr_test_gui/gui.py` → 0건)
    # Seer 가 브링업한 축에 올라타는 방식이다. 단 gui.py 가 controlword 를 아예
    # 안 쓰는 것은 아니다 — `gui.py:942` 의 0x6040=0x86 은 조향축 호밍 전용이다.
    #
    # 2026-08-08 전환(false → true, 커밋 a7420a6): can_relay 프로세스 재시작 뒤 node1 이
    # 0x60FF 를 받고도 안 도는 고장이 이 시퀀스로 복구됐다(지면 주행 2회, node1/node2 이동차
    # 0.5~3.6 mm). ⚠ **조향축은 제외** — fault reset 이 위치 카운터를 지워 조향 0° 기준을
    # 무효화한다(같은 날 실증, `~/home` 으로 복구).
    #
    # ⚠ **debt-017 부분 상환일 뿐이다.** 그 부채가 요구한 검증 조건 중
    #   ① 잭업(바퀴 공중) ② 하드웨어 E-STOP 상비 ③ `0x6041`·`0x603F`·SDO abort 전수 기록
    #   **셋 다 미이행**이다. 위 근거는 지면 주행에서의 「구동 복귀 관측」뿐이다.
    #   잔여 검증 전까지 지면 사용 시 감시할 것.
    # ⚠ **코드 기본값은 여전히 False**(`backend.py` RelayConfig · `driver_node.py` 선언).
    #   활성화는 이 배포 yaml 에서만 일어난다 — launch 가 이 파일을 params_file 로 넣는다.
    # ⚠ **UI 직결 백엔드(`ui/backend_direct.py`)는 미수정**이라 그 경로는 같은 고장이 재현된다.
    allow_bringup: true      # 구동축 전용 브링업 — 조향축 제외 · debt-017 부분 상환

    enable_cmd_vel: true          # false 면 직접 지령(~/steer_deg 등)만 연다
    vmax: 0.2                     # m/s
    wmax: 0.3                     # rad/s
    # 휠 기하. 전/후 노드 귀속은 미판정 항목이다 — 스핀·선회 전에 확정할 것
    module_x: [0.6039, -0.5961]
    module_y: [-0.0014, -0.0014]

    diag_hz: 1.0
    state_hz: 10.0

    # per-bus CAN 에러 상태(판다 0xc3) 폴링. 읽기 전용이라 제어 경로에 영향이 없다.
    # bus_off / error_passive / error_warning 이 서면 diagnostics 를 ERROR 로 올린다.
    # 0 이하로 두면 폴링하지 않는다.
    health_hz: 1.0

    # 호밍 속도(0x6099, 0.1 r/min). 0 = 펌웨어 기본값 2500(=250 r/min).
    # 그 외에는 100~3000 만 허용된다(safety_seer_gate.h:207-208).
    homing_speed: 0
