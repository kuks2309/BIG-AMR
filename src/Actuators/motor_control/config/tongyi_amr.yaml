# Tongyi 4축 AMR 파라미터 — 출처 docs/ros2_driver/2026-07-09-design-inputs.md
# ⚠ 파일 전체를 '실측 확정'으로 읽지 말 것(✓실측·⚠가정 혼재) — 미판정 항목은 docs/debt/registry.md 참조
motor_control_node:
  ros__parameters:
    can_channel: "can1"          # PCAN Pro FD 모터측 채널
    # ⚠ 단독 마스터(Seer 분리)는 기동 전 운전자 전제이고 비트레이트는 본 config 미설정 — registry.md 「미등록 사항」 참조
    kinematics: "dual_steer"     # dual_steer | diff_drive
    # ⚠ diff_drive 는 인라인 차체에 부적합(검증 전 사용 금지) — registry.md 「미등록 사항」 track_width 항 참조
    vmax: 0.2                    # m/s — 초기 안전 상한 (최대 1.23)
    wmax: 0.3                    # rad/s
    cmd_timeout: 0.2             # s — cmd_vel 워치독
    allow_homing_motion: false   # 홈 이탈(0x6064) 상태의 브링업 거부 게이트 — 끄지 말 것
    # ⚠ 호밍 스윙 방어선이 아니다(검출은 0x6064 이탈뿐) — registry.md 「debt-007 부분 판정」 §③ 참조
    steer_settle_tol_deg: 3.0    # 조향 정착 게이트
    homing_tol_deg: 5.0          # 0x6064 ↔ steer_home_counts 이탈 판정 임계
    drive_sign: -1               # 전진(+x) = 모터 음수
    # ⚠ '실측 확정' vs '미검증' 라벨 상충 — 미판정, registry.md 「미등록 사항」 참조
    kin_steer_sign: 1            # +counts = +θ(CCW) ⚠ 가정
    # TODO(debt-004): 실측 2건은 -1(CW) 시사, 확정 전까지 crab/스핀 twist 금지 — registry.md debt-004 참조
    module_drive_nodes: [1, 2]
    module_steer_nodes: [3, 4]
    module_x: [-0.5961, 0.6039]  # ⚠ node1=Rear 가정
    # ⚠ 1차 source 는 node1=Front 라 전/후 반전 의심(미판정), 스핀/크랩 twist 금지 — registry.md 「미등록 사항」 참조
    module_y: [-0.0014, -0.0014]
    # ══ 정정 2026-08-03 ══ 값 갱신 [7871810, 7839894] → [7871815, 7840086].
    #   **정본은 src/Comm/CAN/can_relay/config/machine/foil_a082.yaml `steer_home_counts` 하나다.**
    #   여기 값은 그 사본이며, 정본이 바뀌면 함께 갱신한다.
    #   이전 값은 0° 가 아니라 **raw 판독값**이었다 — 0° 는 Seer 각도로 역산해야 한다:
    #         0° = CAN_0x6064 + Seer_deg × 57344
    #   2026-08-02 종결은 이 식을 문서에 적어 놓고도 채택값에 적용하지 않았다. node3 은 그때
    #   Seer 가 +0.0001° 라 오차가 6c 에 그쳐 안 드러났고, node4 는 +0.0035° 여서 193c 로 드러났다.
    #   실측 확정 (2026-08-03 11:44, orin_steer_crosscheck.py, SILENT·passthrough, 송신 0건,
    #   사용자 확인 Seer 표시 0°, 2회 독립 실행이 counts 단위까지 동일):
    #     node3  CAN 7,871,823 + (−0.000°) → 0° = 7,871,816   (채택값과 1c 차)
    #     node4  CAN 7,840,052 + (+0.001°) → 0° = 7,840,087   (채택값과 1c 차)
    #   ⇒ 「구값은 출처 없는 값」이라는 2026-08-02 판정은 반증됐다 — 출처는 Seer 가 실시간으로
    #     내는 0x607A 조향 목표이고, 값도 맞다. 근거 docs/homing/2026-08-03-can-relay-homing-assets.md §10
    #   ⚠ 7882020 / 7859062 는 펌웨어 GOZERO 상수(호밍 후 정착 목표)이며 0° 가 아니다 — 별개 사안.
    steer_home_counts: [7871815, 7840086]
    # ⚠ 조향 홈 기준계 미판정 — registry.md debt-007 · docs/verified_facts/2026-07-27.md §B-1 참조
    track_width: 1.2             # diff_drive 전용
    # ⚠ 실제는 휠베이스인데 코드는 좌우 이격으로 사용 — registry.md 「미등록 사항」 참조
    odom_frame: "odom"
    base_frame: "base_link"
    publish_tf: true
    odom_rate: 25.0
    diag_rate: 1.0
